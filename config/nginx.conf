worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format  main_timed  '[$time_local] $remote_addr - $status $body_bytes_sent - $request '
                            '- $http_user_agent - $request_time - $upstream_response_time';

    access_log /dev/stdout main_timed;
    error_log /dev/stderr notice;

    keepalive_timeout 65;

    server_tokens off;

    # Disable gzip compression for internal traffic (handled by caddy)
    gzip off;

    # Optimize open file cache
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Forward the proxy scheme from upstream (X-Forwarded-Proto)
    map $http_x_forwarded_proto $forwarded_scheme {
        default off;
        https   on;
    }

    server {
        # listen [::]:80 default_server;
        listen 80 default_server;
        server_name _;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # trust internal proxy headers
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 10.0.0.0/8;
        
        # trust Cloudflare's official IP ranges (IPv4 & IPv6)
        # note: Keep these updated - https://www.cloudflare.com/ips/
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 131.0.72.0/22;
        
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;

        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Include custom nginx configuration if it exists 
        include /usr/src/wordpress/nginx[.]conf;

        # More balanced proxy buffer settings
        proxy_buffer_size 16k;       # For headers (default is 4k)
        proxy_buffers 8 8k;          # 8 buffers of 8k each = 64k total
        proxy_busy_buffers_size 16k; # Can send while receiving

        # Upload limit
        client_max_body_size 50m;
        client_body_buffer_size 128k;

        root /usr/src/wordpress;
        index index.php;

        # redirect server error pages to the static page /50x.html
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/lib/nginx/html;
        }

        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        # Based on https://codeable.io/wordpress-developers-intro-to-docker-part-two/
        location /wp-content {
            root /usr/src/wordpress;
            # expires 7d;
            # add_header Cache-Control "public";

            # Disable PHP in Uploads - Essential security
            location ~ /wp\-content/uploads/.*\.(?:php[1-8]?|pht|phtml?|phps)$ { deny all; }
        }

        location / {
            # Protect System Files - Essential security
            location = /nginx.conf { deny all; }
            location ~ /\.htaccess$ { deny all; }
            location ~ /wp-config.php$ { deny all; }
            location ~ ^/wp-admin/includes/ { deny all; }
            location ~ ^/wp-includes/[^/]+\.php$ { deny all; }
            location ~ ^/wp-includes/js/tinymce/langs/.+\.php$ { deny all; }
            location ~ ^/wp-includes/theme-compat/ { deny all; }
            location ~ ^.*/\.git/.*$ { deny all; }
            location ~ ^.*/\.svn/.*$ { deny all; }

            # Redirect requests for autodiscover.xml to autodiscover.<tld>
            location ~ autodiscover.(xml|src)$ {
                rewrite ^(.*)$ https://autodiscover.$host$request_uri break;
                return 301 $scheme://autodiscover.$host$request_uri;
            }
            
            # Disable PHP in Uploads
            location ~ ^/wp\-content/uploads/.*\.(?:php[1-8]?|pht|phtml?|phps)$ { deny all; }

            # Disable PHP in Plugins
            location ~ ^/wp\-content/plugins/.*\.(?:php[1-8]?|pht|phtml?|phps)$ { deny all; }

            # Disable PHP in Themes
            location ~ ^/wp\-content/themes/.*\.(?:php[1-8]?|pht|phtml?|phps)$ { deny all; }
            
            # WordPress User enumeration blocking author query string
            if ($args ~* "^author=([0-9]+|{num:[0-9]+)") {
                return 403;
            }

            # WordPress User Enumeration author page pretty link
            if ($request_uri ~ "/author/") {
                return 403;
            }

            # Block user enumeration sitemap - note that this covers the unicode version of - as %2d
            if ($request_uri ~ "wp-sitemap-users-[0-9]+.xml") {
                return 403;
            }

            # WordPress REST API User Enumeration
            # if ($request_uri ~ "/wp-json/wp/v2/users") {
            #     return 403;
            # }

            # Restrict xmlrpc.php to Jetpack IP addresses
            location = /xmlrpc.php {
                allow 122.248.245.244/32;
                allow 54.217.201.243/32;
                allow 54.232.116.4/32;
                allow 192.0.80.0/20;
                allow 192.0.96.0/20;
                allow 192.0.112.0/20;
                allow 195.234.108.0/22;
                allow 192.0.64.0/18;
                deny all;

                include fastcgi_params;
                fastcgi_pass unix:/var/run/php-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_param HTTPS $forwarded_scheme;
                fastcgi_connect_timeout 5s;
                fastcgi_send_timeout 60s;
                fastcgi_read_timeout 65s;
            }

            # First attempt to serve request as file, then
            # as directory, then fall back to index.php
            try_files $uri $uri/ /index.php?$args;
        }

        # WordPress SEO plugins generate virtual sitemap XML through PHP.
        # This must be declared before the generic XML/static locations so
        # existing sitemap files cannot bypass WordPress's rewrite handlers.
        location ~* ^/.*sitemap.*\.xml$ {
            rewrite ^ /index.php last;
        }

        # Serve static files directly, bypass PHP
        location ~* \.(jpg|jpeg|gif|png|avif|css|js|ico|webp|webm|mp4|mpeg|mpg|mpe|avi|avifs|svg|woff|woff2)$ {
            access_log off;
            expires max;
            add_header Cache-Control "public";
            log_not_found off;
            try_files $uri =404;
        }
        # pass the PHP scripts to FastCGI server listening on Unix socket
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            #fastcgi_intercept_errors on;
            fastcgi_buffer_size 16k;       # For headers
            fastcgi_buffers 16 4k;         # 16 buffers of 4k each = 64k total
            fastcgi_busy_buffers_size 16k; # Can send while receiving

            fastcgi_index index.php;
            fastcgi_pass unix:/var/run/php-fpm.sock;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;

            # Forward the scheme from upstream
            fastcgi_param HTTPS $forwarded_scheme;

            # Bound requests so saturated or pathological PHP workers do not
            # leave nginx holding connections for several minutes.
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 60s;
            fastcgi_read_timeout 65s;

            fastcgi_buffering on;
            fastcgi_request_buffering on;
        }

        # deny access to . files, for security
        location ~ /\. {
            log_not_found off;
            deny all;
        }

        location ~ \.(html|htm|rtf|rtx|txt|xsd|xsl|xml)$ {
            expires 180s;
            etag on;
            if_modified_since exact;
            add_header Pragma "public";
            add_header Cache-Control "public";
            try_files $uri $uri/ /index.php?$args;
        }
        
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Consider adding a Content-Security-Policy (CSP) for more robust security.
        # add_header Content-Security-Policy "default-src 'self';" always;
    }
}