[global]
; Log to stderr
error_log = /dev/stderr

[www]
; Enable status page
pm.status_path = /fpm-status

; Set listen socket
listen = /var/run/php-fpm.sock
listen.owner = nobody
listen.group = nogroup
listen.mode = 0666

; Keep the pending FastCGI queue bounded so overload fails predictably instead
; of allowing a large request backlog to build behind saturated workers.
listen.backlog = 32

; Keep a small set of warm workers available for traffic bursts. This avoids
; the process-spawn storm that can occur with ondemand while still bounding
; concurrency for the default 2 CPU / 512 MB container.
pm = dynamic

; Limit simultaneous PHP requests to a level appropriate for the default
; container resources. Increase only after measuring worker RSS and CPU usage.
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4

; Recycle workers periodically to contain growth from plugins/libraries.
pm.max_requests = 500

; Make sure the FPM workers can reach the environment variables for configuration
clear_env = no

; Catch output from PHP
catch_workers_output = yes

; Enable slow request logging
slowlog = /dev/stderr
request_slowlog_timeout = 5s

; Prevent pathological requests from occupying a worker for several minutes.
request_terminate_timeout = 60s
